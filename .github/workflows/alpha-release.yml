name: Draft alpha release
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-release
  cancel-in-progress: false

jobs:
  verification:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  release:
    needs: verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit and validate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_public_tree.py
          version=$(sed -n 's/^versionName=//p' android-app/version.properties | tr -d '\r')
          code=$(sed -n 's/^versionCode=//p' android-app/version.properties | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          [[ "$code" =~ ^[1-9][0-9]*$ ]]
          (( code <= 2100000000 ))
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo 'Tag already exists; bump versionName and versionCode.' >&2; exit 1
          fi
          # Compare every previous alpha tag's version code, not just the last semantic tag.
          baseline_code=0
          baseline_sha=''
          for previous in $(git tag -l 'v*-alpha.*'); do
            old=$(git show "$previous:android-app/version.properties" | sed -n 's/^versionCode=//p' | tr -d '\r')
            [[ "$old" =~ ^[1-9][0-9]*$ ]]
            (( code > old )) || { echo 'versionCode must increase.' >&2; exit 1; }
            if (( old > baseline_code )); then
              baseline_code=$old
              baseline_sha=$(git rev-parse "$previous^{commit}")
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # The legacy `tools` package was removed from the Android SDK repository.
      # Explicitly request the supported package instead of the action's obsolete default.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Decode persistent alpha signing key
        env:
          ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ALPHA_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ALPHA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/finance-alpha.p12"
      - name: Build signed debug alpha and run checks
        working-directory: android-app
        env:
          FM_REQUIRE_ALPHA_SIGNING: 'true'
          FM_ALPHA_KEYSTORE: ${{ runner.temp }}/finance-alpha.p12
          FM_ALPHA_STORE_PASSWORD: ${{ secrets.ALPHA_STORE_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Check out previous alpha test sources
        if: steps.version.outputs.baseline_sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.version.outputs.baseline_sha }}
          path: upgrade-baseline
          persist-credentials: false
      - name: Build previous alpha matching test APK
        if: steps.version.outputs.baseline_sha != ''
        working-directory: upgrade-baseline/android-app
        env:
          FM_REQUIRE_ALPHA_SIGNING: 'true'
          FM_ALPHA_KEYSTORE: ${{ runner.temp }}/finance-alpha.p12
          FM_ALPHA_STORE_PASSWORD: ${{ secrets.ALPHA_STORE_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain assembleDebugAndroidTest
      - name: Retain matching upgrade test APKs (not release downloads)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-upgrade-test-apks
          path: |
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            upgrade-baseline/android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
          if-no-files-found: error
      - name: Package APK, notices, checksum and certificate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "dist/finance-ministry-$VERSION-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/finance-ministry-$VERSION-debug.apk" > dist/SIGNING-CERTIFICATE.txt
          cp LICENSE dist/LICENSE.txt
          cp docs/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          cp android-app/app/src/main/assets/licenses/* dist/
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          changes=$(awk -v heading="## $VERSION" '$0 == heading { collecting=1; next } collecting && /^## / { exit } collecting { print }' CHANGELOG.md)
          test -n "$changes"
          printf '%s\n' "Debug alpha $VERSION for testing; not ready for general use." '' \
            'Download the APK asset. See README for setup and permission instructions.' '' \
            "$changes" '' \
            'Existing records are not silently reclassified or assigned to people. Review old errors individually. Backups created by this release use schema 9 and require a schema-9-capable version; they cannot be restored by the published alpha.20 or older. Older supported backups remain readable. CSV schema 3 includes local participant names and is an unencrypted report, not a restore backup. Do not downgrade an updated installation.' '' \
            'Keep any backup password safe; the app cannot recover it. This is an independent app, not a government service or bank.' '' \
            'Install over a previous official alpha to update. Back up an important ledger before updating or replacing data.' '' \
            'JVM tests, lint and assembly passed in this signed release run. The prerequisite Android 16 debug instrumentation and synthetic SMS gates passed. Signed artifact upgrade/recovery and physical-device verification remain separate requirements; consult version-specific reports before wider distribution.' '' \
            "Source commit: $GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Finance Ministry $VERSION (debug alpha)" \
            --draft --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Remove temporary signing file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/finance-alpha.p12"
