name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit public source tree
        run: python3 tools/verify_public_tree.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: JVM tests, lint and debug build
        working-directory: android-app
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-check-reports
          path: android-app/app/build/reports/
          retention-days: 14
          if-no-files-found: ignore
